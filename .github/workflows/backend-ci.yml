name: backend-ci
on:
  push:
    branches: [ master, "slice/**" ]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest   # 自带 Docker，Testcontainers 可用
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # 必须与 pom 的 <java.version> 保持一致：CI 拿旧 JDK 编译新基线会直接失败，
          # 这是框架升级最常见的「本地绿、CI 红」。S01 尚未升到 backend.java 声明的版本
          # （本机没有那个 JDK，见 PR 说明），两处要一起改，不要只改一边。
          java-version: '17'
          # 注：Testcontainers 2.0 起 docker-java 的默认 API 版本已不是当年那个问题版本，
          # -Dapi.version=1.44 现在只是一层无副作用的保险，见下方 run 行。
          cache: maven
      # 注：本 workflow 位于 Loggi_server 仓库内，checkout 根目录即后端项目根，故无需 working-directory。
      # 用 ./mvnw 而非 setup-java 自带的 mvn：wrapper 把 Maven 版本锁在 3.9.6，保证可复现。
      # -Dapi.version=1.44：原为 Testcontainers 1.20.x 的坑——其 docker-java 默认发 API 1.32，
      # 而 Docker Engine 29+ 最低只接受 1.44，会报 "client version 1.32 is too old"。
      # S01 升到 Testcontainers 2.0 后该默认值已提高，本参数退化为无副作用的保险，故保留。
      # 注意属性名是 api.version，docker-java 不认 DOCKER_API_VERSION 环境变量。
      - name: Build & verify (单测 + *IT 集成测试[Testcontainers] + JaCoCo 门禁)
        run: ./mvnw -B verify -Dapi.version=1.44
      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/
