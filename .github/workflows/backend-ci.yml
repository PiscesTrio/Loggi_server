name: backend-ci
on:
  push:
    branches: [ master, "slice/**" ]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest   # ships with Docker, so Testcontainers works
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # Must match <java.version> in the pom — change both, never one; an old JDK cannot
          # compile the new baseline ("green locally, red in CI").
          java-version: '21'
          # (-Dapi.version=1.44 below is redundant now; see the note on the run step.)
          cache: maven
      # Checkout root == backend project root (this workflow lives in Loggi_server), so no
      # working-directory. ./mvnw, not setup-java's mvn: the wrapper pins Maven to 3.9.6.
      # -Dapi.version=1.44 was a Testcontainers 1.20.x trap: its docker-java sent API 1.32, but
      # Docker Engine 29+ needs >= 1.44 — "client version 1.32 is too old". Testcontainers 2.0
      # (S01) raised that default, so it is redundant now but harmless; kept as a guard rail.
      # Property name is api.version; docker-java ignores DOCKER_API_VERSION.
      - name: Build & verify (单测 + *IT 集成测试[Testcontainers] + JaCoCo 门禁)
        run: ./mvnw -B verify -Dapi.version=1.44
      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/
