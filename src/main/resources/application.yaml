server:
  port: 8088
jwt:
  # Deliberately left as a placeholder rather than a working default: JwtTokenUtil refuses to
  # start on CHANGE_ME or on anything shorter than 32 bytes. A default that works is a default
  # that ships, and a publicly known HS256 secret lets anyone mint an administrator token.
  # Generate one with: openssl rand -base64 48
  secret: ${JWT_SECRET:CHANGE_ME}
cors:
  # Patterns, not literal origins, so the dev server's port may vary. A bare "*" is illegal
  # together with allow-credentials and browsers reject that pairing outright.
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*}
# One-time verification codes. Every number here is a security parameter, so it lives in
# configuration where it can be seen and argued about rather than inline in the service.
app:
  verification:
    # 5 minutes, not the 15 the old mail text promised. A code that is valid longer is a
    # code an attacker has longer to guess.
    code-ttl-seconds: ${VERIFICATION_CODE_TTL_SECONDS:300}
    # One send per address per minute. Without it this endpoint is an open mail relay
    # pointed at whoever the caller names.
    send-cooldown-seconds: ${VERIFICATION_SEND_COOLDOWN_SECONDS:60}
    # 6 digits is a million possibilities; unlimited guesses makes that a formality.
    max-attempts: ${VERIFICATION_MAX_ATTEMPTS:5}
    lock-seconds: ${VERIFICATION_LOCK_SECONDS:900}

spring:
  mail:
    host: smtp.qq.com
    protocol: smtp
    default-encoding: UTF-8
    # sender address
    username: ${MAIL_USERNAME:your-email@example.com}
    # app-specific password, not the account password
    password: ${MAIL_PASSWORD:your-mail-password}
    port: 465
    properties:
      mail:
        # Off unless asked for. JavaMail's debug channel prints the whole SMTP
        # conversation to stdout, including the AUTH line - the mail password, in the
        # server log, on every send. It was on by default.
        debug: ${MAIL_DEBUG:false}
        smtp:
          ssl:
            enable: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # Codes and counters only; nothing here needs to survive a restart.
      timeout: 2s
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:test}?characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:your-db-password}
  jackson:
    deserialization:
      # Jackson 3 flipped FAIL_ON_NULL_FOR_PRIMITIVES from false to true, so an *explicit* null
      # landing on a primitive field is now a 400 where Jackson 2 substituted the default.
      # The Flutter client's toJson() emits every key unconditionally, so `remember` arrives as
      # null rather than absent, and login broke on every attempt after the S01 upgrade — while
      # curl sending {email,password} (field absent) still worked, which is why hand probing the
      # API never saw it. A physical device did.
      # This is not one field: Distribution.urgent, Vehicle.driving, Driver.driving and Sale.pay
      # are all primitive booleans, so changing types one at a time is whack-a-mole. Restoring
      # the one default treats the cause.
      fail-on-null-for-primitives: false
  sql:
    init:
      # The project had no data initialisation path at all: ddl-auto only creates tables,
      # compose mounts no init script, and the one ApplicationRunner it shipped was an empty
      # shell (deleted in S07) — a fresh clone came up against an empty database. data.sql
      # deletes-then-inserts by a `seed-` id prefix, so it is repeatable and never touches
      # rows created through the app.
      mode: always
  jpa:
    hibernate:
      ddl-auto: update
    # Required: without it data.sql runs *before* Hibernate creates the tables.
    defer-datasource-initialization: true
    open-in-view: false
    # Off unless asked for. Every statement, with its parameters, went to stdout on
    # every request - the audit log's own INSERTs included, which is how a request's
    # account and IP end up in a log nobody treats as sensitive.
    show-sql: ${JPA_SHOW_SQL:false}
# Root level, i.e. the level for the application as a whole.
logging:
  level:
    root: info
