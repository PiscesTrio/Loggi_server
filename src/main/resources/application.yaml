server:
  port: 8088
jwt:
  # Deliberately left as a placeholder rather than a working default: JwtTokenUtil refuses to
  # start on CHANGE_ME or on anything shorter than 32 bytes. A default that works is a default
  # that ships, and a publicly known HS256 secret lets anyone mint an administrator token.
  # Generate one with: openssl rand -base64 48
  secret: ${JWT_SECRET:CHANGE_ME}
cors:
  # Patterns, not literal origins, so the dev server's port may vary. A bare "*" is illegal
  # together with allow-credentials and browsers reject that pairing outright.
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*}
# One-time verification codes. Every number here is a security parameter, so it lives in
# configuration where it can be seen and argued about rather than inline in the service.
app:
  verification:
    # 5 minutes, not the 15 the old mail text promised. A code that is valid longer is a
    # code an attacker has longer to guess.
    code-ttl-seconds: ${VERIFICATION_CODE_TTL_SECONDS:300}
    # One send per address per minute. Without it this endpoint is an open mail relay
    # pointed at whoever the caller names.
    send-cooldown-seconds: ${VERIFICATION_SEND_COOLDOWN_SECONDS:60}
    # 6 digits is a million possibilities; unlimited guesses makes that a formality.
    max-attempts: ${VERIFICATION_MAX_ATTEMPTS:5}
    lock-seconds: ${VERIFICATION_LOCK_SECONDS:900}

spring:
  profiles:
    # dev unless told otherwise. The profiles differ only in developer conveniences —
    # every one of them is still an environment variable underneath, so a profile sets the
    # default and the environment still wins. Nothing security-relevant is decided here.
    active: ${SPRING_PROFILES_ACTIVE:dev}
  flyway:
    # Flyway owns the schema. Scripts live in db/migration and run before Hibernate is
    # allowed to look at the database.
    enabled: true
    locations: classpath:db/migration
    # For a database that already exists and has no history table — the shape every
    # environment was in when this slice landed. Flyway stamps it as version 1 and starts
    # applying from V2, instead of refusing to touch a non-empty schema. An empty database
    # ignores this and runs V1 onwards normally.
    baseline-on-migrate: true
    baseline-version: 1
    # Never wipe a schema because a command was mistyped. Off in every profile; there is no
    # environment where losing the database quietly is the helpful outcome.
    clean-disabled: true
  mail:
    host: smtp.qq.com
    protocol: smtp
    default-encoding: UTF-8
    # sender address
    username: ${MAIL_USERNAME:your-email@example.com}
    # app-specific password, not the account password
    password: ${MAIL_PASSWORD:your-mail-password}
    port: 465
    properties:
      mail:
        # Off unless asked for. JavaMail's debug channel prints the whole SMTP
        # conversation to stdout, including the AUTH line - the mail password, in the
        # server log, on every send. It was on by default.
        debug: ${MAIL_DEBUG:false}
        smtp:
          ssl:
            enable: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # Codes and counters only; nothing here needs to survive a restart.
      timeout: 2s
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # preserveInstants=false is the part that matters, and it is not cosmetic.
    #
    # Every timestamp in this schema is a LocalDateTime mapped to a MySQL `datetime`. Neither
    # of those carries a time zone — they are wall-clock readings — so no conversion should
    # happen in either direction. The driver was doing one anyway: the URL claimed the server
    # ran on Asia/Shanghai while the container actually runs on UTC, so a value written as
    # 09:00 came back as 10:00, and rows written by the application were stored an hour before
    # the moment they describe. The round trip was self-consistent, which is why nothing
    # looked wrong until S09 turned the string columns into real datetimes and the seed's
    # literal values stopped matching what the API returned.
    #
    # connectionTimeZone=SERVER + preserveInstants=false tells the driver to leave wall-clock
    # values alone. serverTimezone, which this replaces, is the deprecated spelling and was
    # also simply untrue.
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:loggi}?characterEncoding=utf8&connectionTimeZone=SERVER&preserveInstants=false
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:your-db-password}
  jackson:
    deserialization:
      # Jackson 3 flipped FAIL_ON_NULL_FOR_PRIMITIVES from false to true, so an *explicit* null
      # landing on a primitive field is now a 400 where Jackson 2 substituted the default.
      # The Flutter client's toJson() emits every key unconditionally, so `remember` arrives as
      # null rather than absent, and login broke on every attempt after the S01 upgrade — while
      # curl sending {email,password} (field absent) still worked, which is why hand probing the
      # API never saw it. A physical device did.
      # This is not one field: Distribution.urgent, Vehicle.driving, Driver.driving and Sale.pay
      # are all primitive booleans, so changing types one at a time is whack-a-mole. Restoring
      # the one default treats the cause.
      fail-on-null-for-primitives: false
    serialization:
      # Every timestamp goes out as ISO-8601, which is what the OpenAPI document means by
      # `format: date-time`. Each field used to carry its own @JsonFormat with a custom
      # pattern — a wire format the document cannot express, so the document was wrong about
      # every timestamp the API sends. Reading survived it by accident (Dart's DateTime.parse
      # accepts a space where RFC 3339 wants a T); writing did not, and POST /distribution
      # answered 400 to a body the generated client produced exactly as documented.
      # Left to itself Jackson writes a LocalDateTime as an array of numbers, so the
      # annotations could not simply be deleted — this is the setting that replaces them.
      write-dates-as-timestamps: false
  sql:
    init:
      # The project had no data initialisation path at all: ddl-auto only creates tables,
      # compose mounts no init script, and the one ApplicationRunner it shipped was an empty
      # shell (deleted in S07) — a fresh clone came up against an empty database. data.sql
      # deletes-then-inserts by a `seed-` id prefix, so it is repeatable and never touches
      # rows created through the app.
      mode: always
  jpa:
    hibernate:
      # Hibernate no longer changes anything; it only checks. `update` diffed the entities
      # against the database on every boot and applied the additions — it never dropped a
      # column, never changed a type, never recorded what it did, and two instances starting
      # together did it concurrently. What it left behind is visible in any long-lived
      # database from this project: a `user` and a `company` table whose entities are gone,
      # and a `busincess_type` column beside the `business_type` that replaced it.
      # `validate` turns the entity mapping into an assertion: if a migration and an entity
      # disagree, the application refuses to start, here and in CI, instead of drifting.
      ddl-auto: validate
    # defer-datasource-initialization used to be set here and had to go when Flyway arrived.
    # It exists for the ddl-auto case: Hibernate builds the schema as it creates the
    # EntityManagerFactory, so data.sql has to be pushed to *after* that. Boot implements
    # that by making the script initializer depend on the EntityManagerFactory — and, in
    # consequence, by no longer making the EntityManagerFactory wait on database
    # initialisers. Flyway is one of those initialisers. Leaving the flag on therefore let
    # Hibernate validate before Flyway had run: every integration test failed with
    # "Schema validation: missing table [admin]", which reads like a broken migration and is
    # actually an unordered one. Flyway now builds the schema before anything else touches
    # the datasource, and spring.sql.init scripts already run after Flyway by default, so the
    # flag has nothing left to defer.
    open-in-view: false
    # Every statement, with its parameters, went to stdout on every request - the audit
    # log's own INSERTs included, which is how a request's account and IP end up in a log
    # nobody treats as sensitive. The default now comes from the active profile; JPA_SHOW_SQL
    # still overrides either way.
    show-sql: ${JPA_SHOW_SQL:false}
# Actuator. Only what a deployment actually needs, because every exposed endpoint is
# surface: the default set is small, but `*` is a habit that eventually exposes /env or
# /heapdump on something that matters.
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      # UP or DOWN and nothing else. The detail view names the components that are failing
      # - which database, which broker - and that is a description of the internals handed
      # to an unauthenticated caller, since the probe endpoint cannot require a token.
      show-details: never
  info:
    env:
      enabled: false
  health:
    mail:
      # Off, and this is the interesting one. Actuator's mail indicator opens an SMTP
      # connection and authenticates; the credentials here are deliberately placeholders,
      # so on a fresh clone it fails and drags the aggregate status to DOWN - meaning
      # /actuator/health answers 503 and a readiness probe would never let the container
      # into service. The application serves every request perfectly well without a mail
      # server: only the e-mail-code login path degrades, and it degrades with its own
      # error. A dependency that one optional feature needs is not a reason to declare the
      # whole application unhealthy.
      #
      # The database and Redis indicators stay on, because those really do gate serving.
      enabled: false

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    # Alphabetical rather than declaration order, so the page does not reshuffle when a
    # method moves.
    operations-sorter: alpha
    tags-sorter: alpha
  api-docs:
    path: /v3/api-docs

# Root level, i.e. the level for the application as a whole.
logging:
  level:
    root: info
