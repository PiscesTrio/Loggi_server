server:
  port: 8088
jwt:
  secret: ${JWT_SECRET:CHANGE_ME}
spring:
  mail:
    host: smtp.qq.com
    protocol: smtp
    default-encoding: UTF-8
    #发件人
    username: ${MAIL_USERNAME:your-email@example.com}
    #授权码
    password: ${MAIL_PASSWORD:your-mail-password}
    port: 465
    properties:
      mail:
        debug: true
        smtp:
          ssl:
            enable: true
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:test}?characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:your-db-password}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: true
#设置日志级别会给root根节点设置，代表整体应用的级别
logging:
  level:
    root: info
