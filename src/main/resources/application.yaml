server:
  port: 8088
jwt:
  secret: ${JWT_SECRET:CHANGE_ME}
spring:
  mail:
    host: smtp.qq.com
    protocol: smtp
    default-encoding: UTF-8
    #发件人
    username: ${MAIL_USERNAME:your-email@example.com}
    #授权码
    password: ${MAIL_PASSWORD:your-mail-password}
    port: 465
    properties:
      mail:
        debug: true
        smtp:
          ssl:
            enable: true
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:test}?characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:your-db-password}
  jackson:
    deserialization:
      # Jackson 3 把 FAIL_ON_NULL_FOR_PRIMITIVES 的默认值从 false 翻成了 true，于是
      # 请求体里一个**显式的 null** 落到原始类型字段上会被直接 400 掉（Jackson 2 是当默认值处理）。
      # Flutter 客户端的 toJson() 无条件输出每一个键，所以 `remember` 到达时是 null 而不是缺失——
      # 登录因此在 S01 升级后全线失败，而 curl 只发 {email,password}（字段缺失）反而正常，
      # 所以 API 层的手工探测看不见它，是实机端到端跑出来的。
      # 这不是单个字段的问题：Distribution.urgent、Vehicle.driving、Driver.driving、Sale.pay
      # 都是原始 boolean，逐个改成包装类型是打地鼠，恢复这一条默认值才是治面。
      fail-on-null-for-primitives: false
  sql:
    init:
      # 项目此前完全没有数据初始化路径：ddl-auto 只建表，compose 不挂 init 脚本，
      # 唯一的 ApplicationRunner 是空的——clone 下来跑起来是一个空库。
      # data.sql 用 `seed-` 前缀做删除再插入，可重复执行且不碰 App 录入的数据。
      mode: always
  jpa:
    hibernate:
      ddl-auto: update
    # 必需：不设的话 data.sql 会在 Hibernate 建表**之前**执行，直接报表不存在。
    defer-datasource-initialization: true
    open-in-view: false
    show-sql: true
#设置日志级别会给root根节点设置，代表整体应用的级别
logging:
  level:
    root: info
