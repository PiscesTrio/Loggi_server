# S00 安全网：一键起后端 + MySQL8（可复现构建）。
# 用法：cp .env.example .env && 填值 && docker compose up --build
# 注：放在 Loggi_server/ 内（仓库根不是 git 仓库），故构建上下文为当前目录。
services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - mysql_data:/var/lib/mysql

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    # 无 volume:验证码与限流计数器都是短时数据,重启丢掉正是期望行为

  app:
    build:
      context: .
    env_file: .env
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    ports:
      - "8088:8088"
    depends_on:
      mysql:
        condition: service_healthy   # 等 MySQL 健康再启动 app
      redis:
        condition: service_healthy

volumes:
  mysql_data:
