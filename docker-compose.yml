# S00 safety net: bring up the backend and MySQL 8 in one command, reproducibly.
# Usage: cp .env.example .env && fill in the values && docker compose up --build
# This file lives inside Loggi_server/ (the repository root is not a git repository),
# so the build context is the current directory.
services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - mysql_data:/var/lib/mysql

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    # No volume. Verification codes and rate-limit counters are both short-lived; losing
    # them on restart is the behaviour we want, not a cost.

  app:
    build:
      context: .
    env_file: .env
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    ports:
      - "8088:8088"
    depends_on:
      mysql:
        condition: service_healthy   # wait for MySQL to be healthy before starting app
      redis:
        condition: service_healthy

volumes:
  mysql_data:
